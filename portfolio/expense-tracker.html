<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Tracker</title>
<style>
:root{--bg:#f3f6f4;--surface:#fff;--text:#16241f;--muted:#5b6b64;--accent:#0f6b5c;--line:#d5dfda;--danger:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1815;--surface:#17231f;--text:#e8f0ec;--muted:#9ab0a7;--accent:#4fc3ab;--line:#2a3b35;--danger:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:20px}
h1{margin:0 0 16px;font-size:1.6rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.total{font-size:2rem;font-weight:700;color:var(--accent)}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form .full{grid-column:1/-1}
input,select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%}
button.add{background:var(--accent);color:var(--bg);border:0;cursor:pointer;font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ul{list-style:none;margin:0;padding:0}
li.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
li.row:last-child{border:0}
.meta{color:var(--muted);font-size:14px}
.del{width:auto;border:0;background:none;color:var(--danger);cursor:pointer}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--accent)}
.cat{display:flex;justify-content:space-between;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:12px}
</style>
</head>
<body>
<div class="wrap">
<h1>Expense Tracker</h1>
<div class="card"><div class="meta">Total spent</div><div class="total" id="total">₹0.00</div></div>
<div class="card">
<form id="f">
<input class="full" id="t" placeholder="What did you spend on?" aria-label="Description" required>
<input id="a" type="number" min="0.01" step="0.01" placeholder="Amount (₹)" aria-label="Amount" required>
<input id="d" type="date" aria-label="Date" required>
<select class="full" id="c" aria-label="Category"><option>Food</option><option>Travel</option><option>Shopping</option><option>Bills</option><option>Other</option></select>
<button class="add full" type="submit">Add expense</button>
</form>
</div>
<div class="card"><b>By category</b><div id="cats"></div></div>
<div class="card"><b>Expenses</b><ul id="list"></ul></div>
</div>
<script>
var items=[];
try{items=JSON.parse(localStorage.getItem('expenses')||'[]')}catch(e){items=[]}
function save(){try{localStorage.setItem('expenses',JSON.stringify(items))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function money(n){return '\u20b9'+n.toFixed(2)}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){
  var sum=items.reduce(function(s,x){return s+x.a},0);
  $('total').textContent=money(sum);
  var by={};items.forEach(function(x){by[x.c]=(by[x.c]||0)+x.a});
  var keys=Object.keys(by);
  $('cats').innerHTML=keys.length?keys.map(function(k){return '<div class="cat"><span>'+esc(k)+'</span><span>'+money(by[k])+'</span></div><div class="bar"><i style="width:'+(by[k]/sum*100)+'%"></i></div>'}).join(''):'<div class="empty">No expenses yet.</div>';
  $('list').innerHTML=items.length?items.slice().sort(function(a,b){return b.d.localeCompare(a.d)}).map(function(x){return '<li class="row"><div><div>'+esc(x.t)+'</div><div class="meta">'+esc(x.c)+' \u00b7 '+esc(x.d)+'</div></div><div>'+money(x.a)+' <button class="del" data-id="'+x.id+'" aria-label="Delete '+esc(x.t)+'">Delete</button></div></li>'}).join(''):'<li class="empty">Add your first expense above.</li>';
}
$('d').value=new Date().toISOString().slice(0,10);
$('f').addEventListener('submit',function(e){
  e.preventDefault();
  items.push({id:Date.now(),t:$('t').value.trim(),a:parseFloat($('a').value),c:$('c').value,d:$('d').value});
  save();$('t').value='';$('a').value='';render();
});
$('list').addEventListener('click',function(e){
  var id=e.target.getAttribute('data-id');if(!id)return;
  items=items.filter(function(x){return String(x.id)!==id});save();render();
});
render();
</script>
</body>
</html>
